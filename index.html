<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA — Immersive Energy</title>

  <style>
    :root {
      --bg: #0a0a0f;
      --cyan: #00f5d4;
      --green: #00ff88;
      --violet: #7b2ff7;
      --white: #ffffff;
      --silver: #8892b0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: default;
    }

    /* Subtle radial vignette layered over the canvas for depth */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(10, 10, 15, 0) 35%,
        rgba(10, 10, 15, 0.55) 100%
      );
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      pointer-events: none;
      padding: 0 1.5rem;
    }

    /* Push the content block to the golden-ratio line (~38% from top) */
    .content {
      margin-top: 38vh;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 820px;
    }

    .headline {
      font-weight: 200;
      font-size: clamp(3rem, 8vw, 7rem);
      letter-spacing: 0.05em;
      line-height: 1.02;
      background: linear-gradient(180deg, #ffffff 30%, #cfe9e4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(0, 245, 212, 0.15);

      /* entrance animation */
      opacity: 0;
      transform: translateY(20px);
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.5s;
    }

    .subtitle {
      margin-top: 1.5rem;
      font-weight: 300;
      font-size: clamp(0.9rem, 1.5vw, 1.2rem);
      letter-spacing: 0.04em;
      line-height: 1.65;
      color: var(--silver);
      max-width: 560px;

      opacity: 0;
      transform: translateY(20px);
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1s;
    }

    .cta {
      margin-top: 2.75rem;
      pointer-events: auto;
      display: inline-block;
      padding: 0.95rem 2.4rem;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: none;
      background: transparent;
      border: 1px solid rgba(0, 245, 212, 0.45);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: color 0.4s ease, border-color 0.4s ease,
        box-shadow 0.5s ease, transform 0.4s ease;

      opacity: 0;
      transform: translateY(20px);
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.5s;
    }

    /* Glow sweep fill that grows from the bottom on hover */
    .cta::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 245, 212, 0.12),
        rgba(123, 47, 247, 0.12)
      );
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: -1;
    }

    .cta:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 28px rgba(0, 245, 212, 0.35),
        inset 0 0 18px rgba(0, 245, 212, 0.1);
      transform: translateY(-2px);
    }

    .cta:hover::before {
      transform: scaleY(1);
    }

    /* Fine print pinned near the bottom */
    .footnote {
      position: absolute;
      bottom: 2.2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(136, 146, 176, 0.55);
      opacity: 0;
      animation: rise 1.4s ease forwards;
      animation-delay: 2s;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity 0.8s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader .ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(136, 146, 176, 0.2);
      border-top-color: var(--cyan);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .headline, .subtitle, .cta, .footnote {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- ============ WEBGL CANVAS ============ -->
  <canvas id="scene"></canvas>

  <!-- ============ TEXT OVERLAY ============ -->
  <div class="overlay">
    <div class="content">
      <h1 class="headline">Enter the Flux</h1>
      <p class="subtitle">
        A living field of energy — sculpted in light, driven by code.
        Step into an experience where motion, color and form become one.
      </p>
      <a class="cta" href="#" id="cta">Begin the Journey</a>
    </div>
    <div class="footnote">Crafted with Three.js &amp; GLSL</div>
  </div>

  <!-- ============ LOADER ============ -->
  <div class="loader" id="loader"><div class="ring"></div></div>

  <!-- ============ GLSL — TORUS KNOT ============ -->
  <script type="x-shader/x-vertex" id="knot-vert">
    uniform float uTime;

    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying float vDisplacement;

    void main() {
      vNormal = normalize(normalMatrix * normal);

      // Organic displacement: layered sine waves travelling along the surface
      float wave =
        sin(position.x * 4.0 + uTime * 2.0) * 0.06 +
        sin(position.y * 5.0 - uTime * 1.5) * 0.04 +
        sin(position.z * 3.0 + uTime * 1.2) * 0.05;

      vDisplacement = wave;

      vec3 displaced = position + normal * wave;

      vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
      vViewPosition = -mvPosition.xyz;

      gl_Position = projectionMatrix * mvPosition;
    }
  </script>

  <script type="x-shader/x-fragment" id="knot-frag">
    uniform float uTime;
    uniform vec3 uColorA;   // cyan
    uniform vec3 uColorB;   // green
    uniform vec3 uColorC;   // violet accent

    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying float vDisplacement;

    void main() {
      vec3 normal = normalize(vNormal);
      vec3 viewDir = normalize(vViewPosition);

      // Fresnel — brighter towards grazing edges
      float fresnel = 1.0 - max(dot(viewDir, normal), 0.0);
      fresnel = pow(fresnel, 2.5);

      // Color interpolated by the normal's vertical direction
      float mixFactor = normal.y * 0.5 + 0.5;
      vec3 baseColor = mix(uColorA, uColorB, mixFactor);

      // Violet bleed in the deepest displacement valleys
      baseColor = mix(baseColor, uColorC, smoothstep(0.02, -0.08, vDisplacement) * 0.35);

      // Pulsing glow, ~3s period
      float pulse = 0.5 + 0.5 * sin(uTime * (6.2831853 / 3.0));
      float glow = fresnel * (0.6 + pulse * 0.8);

      vec3 color = baseColor * (0.18 + glow * 1.4);
      color += uColorA * pow(fresnel, 4.0) * pulse * 0.6;

      gl_FragColor = vec4(color, 1.0);
    }
  </script>

  <!-- ============ GLSL — PARTICLES ============ -->
  <script type="x-shader/x-vertex" id="particle-vert">
    uniform float uTime;
    uniform float uHover;       // 0..1 hover energy
    uniform float uPixelRatio;

    attribute float aSize;
    attribute float aOffset;    // individual phase offset
    attribute vec3 aColor;

    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      vColor = aColor;

      vec3 pos = position;

      // Individual vertical oscillation, energized on hover
      float osc = sin(uTime * 0.8 + aOffset * 6.2831853) * (0.08 + uHover * 0.12);
      pos.y += osc;
      pos.x += cos(uTime * 0.5 + aOffset * 6.2831853) * 0.04 * (1.0 + uHover);

      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);

      // Soft twinkle
      float twinkle = 0.6 + 0.4 * sin(uTime * 2.0 + aOffset * 30.0);
      vAlpha = twinkle;

      gl_PointSize = aSize * uPixelRatio * (300.0 / -mvPosition.z) * (1.0 + uHover * 0.4);
      gl_Position = projectionMatrix * mvPosition;
    }
  </script>

  <script type="x-shader/x-fragment" id="particle-frag">
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      // Round, soft-edged points
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float alpha = smoothstep(0.5, 0.0, d);
      if (alpha < 0.01) discard;

      gl_FragColor = vec4(vColor, alpha * vAlpha);
    }
  </script>

  <!-- ============ APP ============ -->
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { EffectComposer } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js";
    import { RenderPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js";

    // ---- Palette ----
    const COL = {
      cyan: new THREE.Color("#00f5d4"),
      green: new THREE.Color("#00ff88"),
      violet: new THREE.Color("#7b2ff7"),
    };

    // ---- Renderer ----
    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance",
    });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    // ---- Scene & Camera ----
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 4);

    // Optional cyan point light for particle reflections / scene warmth
    const pointLight = new THREE.PointLight(COL.cyan.getHex(), 2.0, 20);
    pointLight.position.set(0, 0, 3);
    scene.add(pointLight);

    // ---- Group for entrance scale animation ----
    const knotGroup = new THREE.Group();
    knotGroup.position.y = -0.3;
    knotGroup.scale.setScalar(0.0001);
    scene.add(knotGroup);

    // ---- Torus Knot (custom ShaderMaterial) ----
    const knotGeo = new THREE.TorusKnotGeometry(1.2, 0.35, 256, 64, 2, 3);

    const knotMat = new THREE.ShaderMaterial({
      vertexShader: document.getElementById("knot-vert").textContent,
      fragmentShader: document.getElementById("knot-frag").textContent,
      uniforms: {
        uTime: { value: 0 },
        uColorA: { value: COL.cyan.clone() },
        uColorB: { value: COL.green.clone() },
        uColorC: { value: COL.violet.clone() },
      },
    });

    const knot = new THREE.Mesh(knotGeo, knotMat);
    knotGroup.add(knot);

    // Additive "glow shell" — a slightly larger ghost of the knot
    const glowMat = new THREE.ShaderMaterial({
      vertexShader: document.getElementById("knot-vert").textContent,
      fragmentShader: document.getElementById("knot-frag").textContent,
      uniforms: {
        uTime: knotMat.uniforms.uTime, // share time
        uColorA: { value: COL.cyan.clone() },
        uColorB: { value: COL.green.clone() },
        uColorC: { value: COL.violet.clone() },
      },
      transparent: true,
      opacity: 0.15,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.BackSide,
    });
    const glowKnot = new THREE.Mesh(knotGeo, glowMat);
    glowKnot.scale.setScalar(1.06);
    knotGroup.add(glowKnot);

    // ---- Particle system ----
    const PARTICLE_COUNT = 3000;
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const offsets = new Float32Array(PARTICLE_COUNT);

    const tmpColor = new THREE.Color();
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      // Spherical shell distribution, radius 2.0 – 5.0
      const r = 2.0 + Math.random() * 3.0;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);

      // Cyan ↔ violet mix per particle
      tmpColor.copy(COL.cyan).lerp(COL.violet, Math.random());
      colors[i * 3] = tmpColor.r;
      colors[i * 3 + 1] = tmpColor.g;
      colors[i * 3 + 2] = tmpColor.b;

      // Size 0.005 – 0.02, scaled up for screen-space point sizing
      sizes[i] = (0.005 + Math.random() * 0.015) * 100.0;
      offsets[i] = Math.random();
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
    particleGeo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
    particleGeo.setAttribute("aOffset", new THREE.BufferAttribute(offsets, 1));

    const particleMat = new THREE.ShaderMaterial({
      vertexShader: document.getElementById("particle-vert").textContent,
      fragmentShader: document.getElementById("particle-frag").textContent,
      uniforms: {
        uTime: { value: 0 },
        uHover: { value: 0 },
        uPixelRatio: { value: renderer.getPixelRatio() },
      },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // ---- Post-processing: Unreal Bloom ----
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85, // strength
      0.6,  // radius
      0.2   // threshold
    );
    composer.addPass(bloom);
    composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    composer.setSize(window.innerWidth, window.innerHeight);

    // ---- Interaction state ----
    const mouse = { x: 0, y: 0 };
    const camTarget = { x: 0, y: 0 };
    let hoverTarget = 0;

    window.addEventListener("pointermove", (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -((e.clientY / window.innerHeight) * 2 - 1);
    });
    canvas.addEventListener("pointerenter", () => (hoverTarget = 1));
    canvas.addEventListener("pointerleave", () => (hoverTarget = 0));

    // ---- Entrance scale (easeOutExpo over 2s) ----
    const startTime = performance.now();
    const INTRO_DUR = 2000;
    const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));

    // ---- Resize ----
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloom.setSize(w, h);
      particleMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    }
    window.addEventListener("resize", onResize);

    // ---- Render loop ----
    const clock = new THREE.Clock();

    function tick() {
      const elapsed = clock.getElapsedTime();

      // Shared uniforms
      knotMat.uniforms.uTime.value = elapsed;
      particleMat.uniforms.uTime.value = elapsed;

      // Hover energy (smoothed)
      particleMat.uniforms.uHover.value +=
        (hoverTarget - particleMat.uniforms.uHover.value) * 0.05;

      // Entrance scale
      const introT = Math.min((performance.now() - startTime) / INTRO_DUR, 1);
      knotGroup.scale.setScalar(Math.max(0.0001, easeOutExpo(introT)));

      // Knot rotation
      knot.rotation.y += 0.003;
      knot.rotation.z += 0.001;
      glowKnot.rotation.copy(knot.rotation);

      // Particle counter-rotation (energized on hover)
      const pSpeed = 0.0006 * (1 + particleMat.uniforms.uHover.value * 1.5);
      particles.rotation.y -= pSpeed;
      particles.rotation.x -= pSpeed * 0.4;

      // Camera parallax (lerped)
      camTarget.x = mouse.x * 0.3;
      camTarget.y = mouse.y * 0.2;
      camera.position.x += (camTarget.x - camera.position.x) * 0.05;
      camera.position.y += (camTarget.y - camera.position.y) * 0.05;
      camera.lookAt(0, -0.3, 0);

      composer.render();
      requestAnimationFrame(tick);
    }

    // ---- Kick off ----
    tick();

    // Hide loader once the first frames are rendered
    requestAnimationFrame(() =>
      requestAnimationFrame(() => {
        document.getElementById("loader").classList.add("hidden");
      })
    );

    // Prevent the placeholder CTA from jumping the page
    document.getElementById("cta").addEventListener("click", (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
