<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SEPURAN module render scene</title>
<style>html,body{margin:0;background:#150a24;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260712);

const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(1600, 900);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x150a24);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(30, 1600/900, 0.05, 100);

const key  = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(3.5, 4, 2.5);
const rimP = new THREE.DirectionalLight(0x7a4dd8, 3.4); rimP.position.set(-4.5, 1.5, -3.2);
const rimW = new THREE.DirectionalLight(0xdfe6ff, 1.8); rimW.position.set(4.5, -1, -3);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-2, -2.5, 3);
scene.add(key, rimP, rimW, fill);

/* ---------- textures ---------- */
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
/* label band wrapped around the tube — text drawn rotated so it reads ALONG the module axis
   (cylinder UV: u = circumference, v = axis) */
const labelTex = canvasTex(1024, 2048, (ctx, W, H) => {
  ctx.fillStyle = '#3fae4c'; ctx.fillRect(0, 0, W, H);          // SEPURAN green
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for(let x = 0; x < W; x += 6) ctx.fillRect(x, 0, 2, H);        // subtle coating texture
  ctx.save();
  ctx.translate(W*0.42, H*0.5);
  ctx.rotate(Math.PI/2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 130px Manrope, Arial, sans-serif';
  ctx.fillText('SEPURAN® Green', 0, -70);
  ctx.font = '300 56px Manrope, Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fillText('Biogas Upgrading Membrane  ·  Evonik', 0, 60);
  ctx.font = '500 44px Manrope, Arial, sans-serif';
  ctx.fillText('TYP G-4   ·   p max 20 bar   ·   CH₄ ≥ 97 %', 0, 150);
  ctx.restore();
});
/* perforated gas distribution plate */
const plateTex = canvasTex(512, 512, (ctx, W, H) => {
  ctx.fillStyle = '#2a2a2e'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#0c0c0e';
  for(let r = 40; r < 240; r += 46)
    for(let a = 0; a < Math.PI*2; a += Math.PI/ (r/14))
      { ctx.beginPath(); ctx.arc(W/2 + Math.cos(a)*r, H/2 + Math.sin(a)*r, 11, 0, 7); ctx.fill(); }
});

/* ---------- materials ---------- */
const mGreen  = new THREE.MeshStandardMaterial({color:0x3fae4c, metalness:0.25, roughness:0.42, side:THREE.DoubleSide});
const mLabel  = new THREE.MeshStandardMaterial({map:labelTex, metalness:0.25, roughness:0.4});
const mBlack  = new THREE.MeshStandardMaterial({color:0x141416, metalness:0.55, roughness:0.45});
const mSteel  = new THREE.MeshStandardMaterial({color:0xb9bcc4, metalness:1.0, roughness:0.3});
const mORing  = new THREE.MeshStandardMaterial({color:0x0a0a0c, metalness:0.1, roughness:0.75});
const mPlate  = new THREE.MeshStandardMaterial({map:plateTex, metalness:0.8, roughness:0.5});
const mFiber  = new THREE.MeshStandardMaterial({color:0xeae3d2, metalness:0.02, roughness:0.85, emissive:0x151008, emissiveIntensity:0.15});
const mPot    = new THREE.MeshStandardMaterial({color:0xcaa25a, metalness:0.1, roughness:0.5}); // epoxy tube-sheet
/* potting face: packed fiber-end dots in amber resin */
const potTex = canvasTex(512, 512, (ctx, W, H) => {
  ctx.fillStyle = '#b78c44'; ctx.fillRect(0, 0, W, H);
  for(let r = 16; r < 232; r += 15)
    for(let a = 0; a < Math.PI*2; a += Math.PI/Math.max(4, r/9)){
      const x = W/2 + Math.cos(a)*r, y = H/2 + Math.sin(a)*r;
      ctx.fillStyle = '#efe7d4'; ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#5b4a2a'; ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 7); ctx.fill(); // lumen
    }
});
const mPotFace = new THREE.MeshStandardMaterial({map:potTex, metalness:0.1, roughness:0.55});

/* ---------- module build (axis along X) ---------- */
const rig = new THREE.Group(); scene.add(rig);
const mod = new THREE.Group(); rig.add(mod);
const L = 3.2, R = 0.52;

const parts = {};
function part(name){ const g = new THREE.Group(); parts[name] = g; mod.add(g); return g; }

/* hollow-fiber bundle */
const gFibers = part('fibers');
{
  const MAX = 620;
  const geo = new THREE.CylinderGeometry(0.008, 0.008, L*0.90, 5);
  const inst = new THREE.InstancedMesh(geo, mFiber, MAX);
  const m = new THREE.Matrix4(), e = new THREE.Euler(0, 0, Math.PI/2);
  let n = 0;
  for(let ring = 0; ring < 15 && n < MAX; ring++){
    const rr = ring * 0.030;
    const cnt = ring === 0 ? 1 : Math.floor(ring*6.3);
    for(let k = 0; k < cnt && n < MAX; k++){
      const a = k/cnt*Math.PI*2 + ring*0.4;
      m.makeRotationFromEuler(e);
      m.setPosition(0, Math.cos(a)*rr + (rng()-0.5)*0.008, Math.sin(a)*rr + (rng()-0.5)*0.008);
      inst.setMatrixAt(n++, m);
    }
  }
  inst.count = n;
  gFibers.add(inst);
  // epoxy potting (tube-sheet) discs at both ends holding the fibers
  for(const s of [-1, 1]){
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(R*0.86, R*0.86, 0.12, 48), mPot);
    pot.rotation.z = Math.PI/2; pot.position.x = s*(L*0.46); gFibers.add(pot);
    const face = new THREE.Mesh(new THREE.CircleGeometry(R*0.86, 48), mPotFace);
    face.rotation.y = s*Math.PI/2; face.position.x = s*(L*0.46 + 0.061); gFibers.add(face);
  }
}

/* cartridge tube: two halves + merged tube */
const gHalfTop = part('halfTop'), gHalfBot = part('halfBottom'), gTube = part('tube');
{
  const halfGeo = new THREE.CylinderGeometry(R, R, L, 64, 1, true, 0, Math.PI);
  const top = new THREE.Mesh(halfGeo, mGreen); top.rotation.z = Math.PI/2; gHalfTop.add(top);
  const bot = new THREE.Mesh(halfGeo.clone(), mGreen);
  bot.rotation.z = Math.PI/2; bot.rotation.x = Math.PI; gHalfBot.add(bot);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(R, R, L, 96), mGreen);
  tube.rotation.z = Math.PI/2; gTube.add(tube);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(R+0.002, R+0.002, L*0.56, 96, 1, true), mLabel);
  band.rotation.z = Math.PI/2; band.rotation.x = Math.PI*0.55; gTube.add(band);
}

/* o-rings, plates, caps, ports (mirrored pairs) */
const gORings = part('orings'), gPlates = part('plates'), gCaps = part('caps');
for(const s of [-1, 1]){
  const oring1 = new THREE.Mesh(new THREE.TorusGeometry(R*0.94, 0.028, 12, 64), mORing);
  oring1.rotation.y = Math.PI/2; oring1.position.x = s*(L/2 - 0.10); gORings.add(oring1);
  const oring2 = oring1.clone(); oring2.position.x = s*(L/2 - 0.22); gORings.add(oring2);

  const plate = new THREE.Mesh(new THREE.CylinderGeometry(R*0.93, R*0.93, 0.05, 64), mPlate);
  plate.rotation.z = Math.PI/2; plate.position.x = s*(L/2 - 0.30); gPlates.add(plate);

  const cap = new THREE.Group();
  const capBody = new THREE.Mesh(new THREE.CylinderGeometry(R*1.06, R*1.06, 0.34, 64), mBlack);
  capBody.rotation.z = Math.PI/2; cap.add(capBody);
  const capDome = new THREE.Mesh(new THREE.SphereGeometry(R*1.06, 48, 16, 0, Math.PI*2, 0, Math.PI/2), mBlack);
  capDome.rotation.z = -s*Math.PI/2; capDome.scale.set(0.5, 1, 1); capDome.position.x = s*0.17; cap.add(capDome);
  const port = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.34, 32), mSteel);
  port.rotation.z = Math.PI/2; port.position.x = s*0.48; cap.add(port);
  const portRing = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.02, 10, 32), mSteel);
  portRing.rotation.y = Math.PI/2; portRing.position.x = s*0.62; cap.add(portRing);
  cap.position.x = s*(L/2 + 0.12);
  gCaps.add(cap);
}

/* clamps + screws */
const gClamps = part('clamps'), gScrews = part('screws');
const screwItems = [];
for(const s of [-1, 1]){
  const clamp = new THREE.Group();
  const band = new THREE.Mesh(new THREE.CylinderGeometry(R+0.05, R+0.05, 0.16, 64, 1, true), mSteel);
  band.rotation.z = Math.PI/2; clamp.add(band);
  const lip1 = new THREE.Mesh(new THREE.TorusGeometry(R+0.05, 0.018, 10, 64), mSteel);
  lip1.rotation.y = Math.PI/2; lip1.position.x = 0.08; clamp.add(lip1);
  const lip2 = lip1.clone(); lip2.position.x = -0.08; clamp.add(lip2);
  const block = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 0.12), mSteel);
  block.position.set(0, R+0.11, 0); clamp.add(block);
  clamp.position.x = s*(L/2 - 0.42);
  gClamps.add(clamp);

  for(const sz of [-1, 1]){ // hex screws through each clamp block
    const screw = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.20, 6), mSteel);
    shaft.rotation.z = Math.PI/2; screw.add(shaft);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.045, 6), mSteel);
    head.rotation.z = Math.PI/2; head.position.x = 0.11; screw.add(head);
    screw.position.set(s*(L/2 - 0.42) + sz*0.10, R+0.11, 0);
    screw.rotation.y = sz > 0 ? 0 : Math.PI;
    gScrews.add(screw);
    screwItems.push({grp:screw, home:screw.position.clone(), dir:new THREE.Vector3(sz, 0.6, 0).normalize()});
  }
}

/* faint purple ground glow disc for orbit poster depth */
const glow = new THREE.Mesh(new THREE.CircleGeometry(3.2, 64),
  new THREE.MeshBasicMaterial({color:0x2a1450, transparent:true, opacity:0.55}));
glow.rotation.x = -Math.PI/2; glow.position.y = -2.35; scene.add(glow);

/* ---------- helpers ---------- */
const clamp01 = v => Math.min(1, Math.max(0, v));
const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const lerp = (a, b, t) => a + (b - a)*t;
const win = (t, a, b) => ease(clamp01((t - a)/(b - a)));

function resetState(){
  rig.rotation.set(0, 0, 0); mod.rotation.set(0, 0, 0); mod.position.set(0, 0, 0);
  for(const g of Object.values(parts)){ g.position.set(0,0,0); g.rotation.set(0,0,0); g.visible = true; }
  for(const si of screwItems){ si.grp.position.copy(si.home); si.grp.rotation.x = 0; }
  glow.visible = false;
  camera.fov = 30;
}

/* ---------- sequences ---------- */
const sequences = {
  /* upright turntable, seamless 360 */
  orbit(t){
    resetState();
    glow.visible = true;
    parts.halfTop.visible = parts.halfBottom.visible = false; // assembled look
    mod.rotation.z = -Math.PI/2;         // axis vertical, label upright
    rig.rotation.y = t*Math.PI*2;
    camera.position.set(0, lerp(0.35, -0.3, ease(t > 0.5 ? 2-2*t : 2*t)), 8.8);
    camera.fov = 32;
    camera.lookAt(0, 0, 0);
  },
  /* the wow assembly: fibers -> halves -> tube -> o-rings -> plates -> caps -> clamps -> screws */
  assembly(t){
    resetState();
    // stage windows
    const kFib   = win(t, 0.00, 0.08);
    const kHalf  = win(t, 0.08, 0.26);
    const merged = t >= 0.27;
    const kRing  = win(t, 0.30, 0.44);
    const kPlate = win(t, 0.44, 0.58);
    const kCap   = win(t, 0.58, 0.74);
    const kClamp = win(t, 0.76, 0.88);
    const kScrew = win(t, 0.86, 0.97);

    // fibers drift together from a loose spread
    parts.fibers.position.y = (1 - kFib)*0.35;
    parts.fibers.rotation.x = (1 - kFib)*0.3;

    // tube halves close around the bundle, then become one tube
    parts.halfTop.visible = !merged; parts.halfBottom.visible = !merged;
    parts.tube.visible = merged;
    parts.halfTop.position.y    =  (1 - kHalf)*1.7;
    parts.halfBottom.position.y = -(1 - kHalf)*1.7;

    // fittings fly in from the sides
    const slide = (g, k, d) => { g.children.forEach((c, i) => {
      const s = c.position.x >= 0 ? 1 : -1;
      c.userData.hx ??= c.position.x;
      c.position.x = c.userData.hx + s*d*(1 - k);
    }); };
    slide(parts.orings, kRing, 2.0);
    slide(parts.plates, kPlate, 2.5);
    slide(parts.caps,   kCap,   3.1);
    parts.orings.visible = t > 0.28; parts.plates.visible = t > 0.40; parts.caps.visible = t > 0.54;

    // clamps drop on from above
    parts.clamps.visible = t > 0.72;
    parts.clamps.position.y = (1 - kClamp)*1.9;
    parts.clamps.rotation.x = (1 - kClamp)*0.5;

    // screws fly in radially and thread themselves in
    parts.screws.visible = t > 0.82;
    for(const si of screwItems){
      si.grp.position.copy(si.home).addScaledVector(si.dir, (1 - kScrew)*1.1);
      si.grp.rotation.x = (1 - kScrew)*Math.PI*6;   // spinning in
    }

    // gentle presentation motion
    mod.rotation.y = lerp(-0.45, 0.35, ease(t));
    mod.rotation.z = lerp(0.10, 0.02, ease(t));
    const k = ease(t);
    camera.position.set(lerp(2.4, 1.6, k), lerp(1.7, 0.9, k), lerp(6.6, 5.6, k));
    camera.fov = 32;
    camera.lookAt(0, 0, 0);
  },
};

window.SCENE = {
  setSize(w, h){ renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); },
  renderFrame(seq, t){ sequences[seq](clamp01(t)); camera.updateProjectionMatrix(); renderer.render(scene, camera); },
  snapshot(type = 'image/webp', q = 0.8){ return renderer.domElement.toDataURL(type, q); },
  webglInfo(){ const gl = renderer.getContext(); const d = gl.getExtension('WEBGL_debug_renderer_info');
    return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : 'unknown'; },
};
window.SCENE_READY = true;
</script>
</body>
</html>
